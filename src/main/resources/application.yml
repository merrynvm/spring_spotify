spring:
  datasource:
    url: jdbc:mysql://localhost:3306/spotifyDB
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
server:
  port: 8080
  servlet:
    session:
      # Così, a ogni riavvio dell'applicazione verranno invalidate tutte le sessioni
      #(incluso il SecurityContext), e al prossimo F5 ti verrà richiesto di effettuare nuovamente il login.
      persistent: false